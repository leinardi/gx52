[package]
name = "gx52"
version = "0.1.0"
authors = ["Roberto Leinardi"]
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# Keep the version features in sync with the Flatpak runtime (build-aux/*.json)
# and the dependency() checks in meson.build. Required: GNOME 50 (GTK 4.22, libadwaita 1.9, what
# Ubuntu 26.04 ships); tested on the GNOME 51 runtime.
# adw's gtk_v4_* feature matters too: without gtk_v4_10, adw widgets do not implement
# gtk::Accessible in Rust (no a11y methods, failed upcasts).
gtk = { package = "gtk4", version = "0.11", features = ["gnome_50"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9", "gtk_v4_22"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = true # flatpak-builder splits debuginfo into the .Debug extension
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3 # keep Devel builds responsive

[lints.rust]
unsafe_code = "deny" # allowed locally, with a SAFETY comment (setlocale)

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# GObject wrappers commonly expose new() without Default and repeat module names.
new_without_default = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# `use super::*;` inside `mod imp` and the gtk/adw preludes are idiomatic.
wildcard_imports = "allow"
