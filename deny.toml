# cargo-deny: the dependency gate for the Rust workspace. `cargo deny --workspace check` runs every
# section; the advisories section needs the network to be current.

[graph]
all-features = true

[advisories]
# Every vulnerability and unsound advisory fails; "unmaintained" fails for direct and transitive
# crates alike unless ignored here by advisory ID, with a reason. An ignore written as
# `{ crate = "name" }` would only ignore yanked versions, so none is.
version = 2
unmaintained = "all"
yanked = "deny"
ignore = [
    # Unmaintained, the parser under serde_yaml_ng, which only the meta crate's tests use, to read
    # this repository's own workflows and .pre-commit-config.yaml; nothing it parses reaches the
    # application. No vulnerability is reported against it; serde-saphyr is the safe-Rust way out
    # if that changes.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained, transitive via serde_yaml_ng in the meta crate's tests only; no known vulnerability" },
]

[licenses]
version = 2
# Only the licences the Cargo.lock graph needs, each added by the change that brings in the crate
# needing it, with a comment naming that crate. GPL-3.0-or-later is this project's own (every
# workspace member carries it). Every licence added here must be compatible with GPL-3.0-or-later,
# since the shipped binary links them all.
allow = [
    "GPL-3.0-or-later",
    # The gtk-rs bindings (gtk4, libadwaita, glib, gio and their -sys crates), gettext-rs and
    # tracing, the meta crate's serde_yaml_ng and unsafe-libyaml, and the "MIT OR Apache-2.0"
    # crates (regex, and the meta crate's tempfile and toml among them); GPL-compatible.
    "MIT",
    # temp-dir (a build dependency of gettext-sys); compatible with GPL-3.0 (not with
    # GPL-2.0-only, which this project is not).
    "Apache-2.0",
    # target-lexicon, through cfg-expr and system-deps, the build-time pkg-config probe of the
    # -sys crates; the LLVM exception only relaxes Apache-2.0, so it is GPL-3.0-compatible too.
    "Apache-2.0 WITH LLVM-exception",
    # unicode-ident (through proc-macro2), whose Unicode data tables carry it; a permissive,
    # GPL-compatible licence.
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
