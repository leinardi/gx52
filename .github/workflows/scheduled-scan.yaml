name: Scheduled scan

# Adapted from swarm-device-access/.github/workflows/scheduled-scan.yaml (the dependencies job; the
# image job has no counterpart here). A release is checked once, when it is built. Advisories are
# published every day and GNOME releases a runtime every six months, so every week the trunk's
# dependencies are checked again with cargo-deny, and the manifests' GNOME runtime is compared
# with the newest one on Flathub. A failure fails the run, which is what makes it visible (no
# issue is opened): fix it on the trunk.
#
# GitHub runs a schedule only from the default branch, with that branch's file and commit. Until
# the rewrite lands (M9) the default branch is the legacy master, so this file lives there and
# every job checks out rust-rewrite explicitly. At M9 it moves to the trunk and the explicit ref
# goes (docs/tooling-todo.md, "Cleanup when the rewrite lands").
on:
  schedule:
    # Mondays, 06:23 UTC: off the hour, when scheduled runs pile up.
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  TRUNK: rust-rewrite

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TRUNK }}
          persist-credentials: false

      # cargo-deny reads the graph through cargo metadata, with the pinned toolchain
      # (rust-toolchain.toml).
      - name: Set up Rust
        run: rustup toolchain install --no-self-update

      - name: Set up cargo-deny
        uses: leinardi/gh-composite-actions/setup-cargo-deny@addc113a34e0a96ca2e08218380fdecad2fdd230 # v1.4.2

      # Every cargo-deny check over the whole workspace, as ci.yaml's deny job runs it: a new
      # advisory against a crate nobody touched shows up here. rust.mk passes --workspace.
      - name: Check the Rust dependencies with cargo-deny
        run: make rust-deny

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TRUNK }}
          persist-credentials: false

      - name: Install Flatpak
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends flatpak

      # Both manifests must name the same GNOME runtime. The current one must be on Flathub (a
      # positive control: a lookup that fails for any other reason fails the run instead of
      # reading as "no newer runtime"), and the next one must not be.
      - name: Compare the GNOME runtime with Flathub's newest
        run: |
          set -euo pipefail
          read_runtime() {
            jq -er '[.runtime, ."runtime-version"] | if all(type == "string") then join(" ") else error("no runtime") end' "$1"
          }
          STABLE=$(read_runtime build-aux/com.leinardi.gx52.json)
          DEVEL=$(read_runtime build-aux/com.leinardi.gx52.Devel.json)
          if [ "$STABLE" != "$DEVEL" ]; then
            echo "The manifests disagree on the runtime: '$STABLE' (stable) and '$DEVEL' (Devel)." >&2
            exit 1
          fi
          read -r RUNTIME VERSION <<<"$STABLE"
          if [ "$RUNTIME" != org.gnome.Platform ] || ! [[ "$VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "Expected org.gnome.Platform with a whole version, got '$STABLE'." >&2
            exit 1
          fi
          NEXT=$((VERSION + 1))
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          if ! flatpak remote-info --user flathub "runtime/$RUNTIME/x86_64/$VERSION" >/dev/null; then
            echo "Could not find $RUNTIME//$VERSION on Flathub, so a newer one cannot be ruled out." >&2
            exit 1
          fi
          if flatpak remote-info --user flathub "runtime/$RUNTIME/x86_64/$NEXT" >/dev/null 2>&1; then
            echo "::error::GNOME $NEXT ($RUNTIME//$NEXT) is on Flathub; the manifests use $VERSION. Move both manifests and the SDK extensions to it on the trunk."
            exit 1
          fi
          echo "The manifests use $RUNTIME//$VERSION, the newest on Flathub."
