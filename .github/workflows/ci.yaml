name: CI

# Adapted from swarm-device-access/.github/workflows/ci.yaml at 4cd31c4cea79 (Apache-2.0, same
# author), with the GNOME jobs of spike S6. The authoritative checks run on every pull request and
# every push to master and rust-rewrite; the reviewdog jobs only annotate pull requests. ci-result
# is the one required check.
on:
  pull_request:
  push:
    branches:
      - master
      - rust-rewrite
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

# Nothing by default: every job states the permissions it needs.
permissions: {}

jobs:
  # The authoritative lint gate: every pre-commit hook over every file, on the bare runner. Skipped
  # here, each because a dedicated job below runs it (meta/tests/ci_gates.rs keeps the two lists
  # in step): the hooks that need GTK 4, libadwaita, blueprint-compiler or a Meson as new as the
  # GNOME SDK's run in sdk-checks, cargo-test is split between flatpak (meson test) and meta,
  # cargo-deny runs in deny (it needs the network), and flatpak-builder-lint in flatpak, where the
  # linter is.
  pre-commit-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # For the cargo-fmt and cargo-machete hooks and the language: system hooks that run cargo
      # (docs links). The Rust cache is saved only on a pull request: on a push it would write
      # the master cache scope.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install --no-cache-dir pre-commit==4.6.2

      # Restore only: pre-commit-warmup.yaml saves the entry on master under the same key.
      - name: Restore the pre-commit cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run every pre-commit hook on every file
        env:
          SKIP: cargo-clippy,cargo-test,cargo-deny,blueprint-format,meson-format,flatpak-builder-lint
        run: pre-commit run --all-files --show-diff-on-failure

      # pre-commit fails a hook that modifies a tracked file, which covers the auto-fixing hooks
      # (markdownlint fix, prettier); this also fails on a file a hook creates, which its diff
      # check does not see, so no fix can pass silently.
      - name: Fail if a hook modified a file
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # The meta-tests, the half of the cargo-test hook that needs no GTK: they read the git checkout
  # (git ls-files, scratch repositories), which a Flatpak build does not have. The cache is saved
  # only on a pull request, as in pre-commit-all.
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' }}

      - name: Run the meta-tests
        run: cargo test --locked -p meta

  # cargo-deny over the whole workspace: advisories (the database needs the network), licences,
  # bans and sources.
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check dependencies with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # The root is a package as well as the workspace, so without --workspace cargo-deny
          # would check the application's graph only, not the meta and x52 crates.
          arguments: --workspace
          command: check

  # The Devel Flatpak on both architectures, natively (spike S6): the GNOME 51 SDK builds the
  # application and runs meson test (cargo test of gx52 and x52, the GTK half of the cargo-test
  # hook, and desktop, metainfo and schema validation), and flatpak-builder-lint checks both
  # manifests. The image ships flatpak-builder,
  # flatpak-builder-lint and uv, so the lint runs the same make target as the pre-commit hook.
  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the Devel Flatpak and run meson test
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: build-aux/com.leinardi.gx52.Devel.json
          arch: ${{ matrix.arch }}
          bundle: gx52-devel-${{ matrix.arch }}.flatpak
          run-tests: true
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Lint the Flatpak manifests
        run: make flatpak-lint-manifest FLATPAK_BUILDER_LINT=flatpak-builder-lint

  # The checks that need the GNOME SDK, run in it directly: the runner's GTK is older than the
  # runtime, and the image ships the SDK but not the Rust extension, the one thing installed here.
  # Each command is the one of a hook pre-commit-all skips (cargo-clippy, blueprint-format,
  # meson-format), plus the rustdoc gate of make verify; the tests of gx52 and x52 run in the
  # flatpak job's meson test. Cargo's target directory and home are in the checkout, so they are
  # cached between runs, keyed on the architecture, Cargo.lock and the toolchain pin.
  sdk-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The extension of the Devel manifest; the SDK is the image's, left as it is.
      - name: Install the Rust SDK extension
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable//26.08

      - name: Cache the Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-home
          key: sdk-checks|${{ runner.arch }}|${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            sdk-checks|${{ runner.arch }}|

      - name: Run the SDK checks
        # The checkout directory belongs to the runner's user, and root in the sandbox has no
        # capability to write to it, so the two writable directories are created out here, owned by
        # the container's root, which is the sandbox's user.
        run: |
          ls -ld "${GITHUB_WORKSPACE}"
          mkdir -p target .cargo-home
          flatpak run --devel --share=network --filesystem="${GITHUB_WORKSPACE}" \
            --env=PATH=/usr/bin:/usr/lib/sdk/rust-stable/bin \
            --env=CARGO_HOME="${GITHUB_WORKSPACE}/.cargo-home" \
            --command=bash org.gnome.Sdk//51 -s "${GITHUB_WORKSPACE}" <<'CHECKS'
          set -eux
          cd "$1"
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          make rust-doc
          blueprint-compiler format data
          meson format --check-diff meson.options $(find . -name meson.build -not -path './_*' -not -path './.*' -not -path './target/*')
          CHECKS

  actionlint:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # reviewdog posts findings as pull request review comments
    # (-reporter=github-pr-review), not as checks.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run actionlint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/actionlint@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  pre-commit-hooks:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # reviewdog posts findings as pull request review comments
    # (-reporter=github-pr-review), not as checks.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run pre-commit hooks + reviewdog diff
        uses: leinardi/gha-pre-commit-reviewdog-actions/pre-commit-hooks@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          hooks: |
            check-merge-conflict
            end-of-file-fixer
            trailing-whitespace
            check-yaml
            check-json
            check-toml
            check-xml
            check-added-large-files

  markdownlint:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # reviewdog posts findings as pull request review comments
    # (-reporter=github-pr-review), not as checks.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run markdownlint-cli2 via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/markdownlint-cli2@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # reviewdog posts findings as pull request review comments
    # (-reporter=github-pr-review), not as checks.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run shellcheck via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/shellcheck@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  yamllint:
    # Reports inline PR review comments over a diff range; a manual dispatch has
    # neither a pull request to comment on nor a base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # reviewdog posts findings as pull request review comments
    # (-reporter=github-pr-review), not as checks.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run yamllint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/yamllint@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  conventional-commits:
    # The release version is derived from the commit types since the last tag,
    # so a commit nobody can classify is a release nobody can version. The local
    # commit-msg hook only runs where `make pre-commit-install` was run; this job
    # is the check that no commit skips. It runs the repository's own
    # conventional-pre-commit hook, so --force-scope applies here too, and it
    # skips merge commits. Pull requests land as merge commits (AGENTS.md), so
    # every commit counts and the pull-request title never becomes one.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # The action takes no token and only prints annotations.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate the commit messages
        uses: leinardi/gha-pre-commit-reviewdog-actions/conventional-commits@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}

  # The one required check that stands for the rest: GitHub counts a skipped required job as
  # passing, so this job always runs and decides. On a pull request every needed job must succeed;
  # on a push or a dispatch conventional-commits, which only runs on pull requests, is skipped and
  # the others must succeed. The reviewdog jobs (actionlint, pre-commit-hooks, markdownlint,
  # shellcheck, yamllint) only annotate and are not needed: pre-commit-all runs the same hooks on
  # every file.
  ci-result:
    if: always()
    needs:
      - pre-commit-all
      - meta
      - deny
      - flatpak
      - sdk-checks
      - conventional-commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Check the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          failed="$(jq -r --arg event "${EVENT}" '
            to_entries[]
            | select(.value.result != "success")
            | select(
                (
                  $event != "pull_request"
                  and .key == "conventional-commits"
                  and .value.result == "skipped"
                ) | not
              )
            | "\(.key): \(.value.result)"
          ' <<<"${NEEDS}")"
          if [[ -n "${failed}" ]]; then
            echo "::error::Needed jobs did not succeed:"
            echo "${failed}"
            exit 1
          fi
          echo "Every needed job succeeded."
