name: Flathub PR

# A stub on the legacy master, so that `gh workflow run flathub-pr.yaml --ref rust-rewrite` finds
# the workflow: GitHub registers a workflow_dispatch workflow only from the default branch, and the
# dispatch then runs the named ref's real flathub-pr.yaml. Its inputs are the real file's
# (docs/release.md lists them); the real file is the only one that acts. It goes when the rewrite
# lands (M9).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to ship, vX.Y.Z"
        type: string
        required: true
      channel:
        description: "The Flathub branch the pull request targets (a 0.x tag goes to beta only)"
        type: choice
        required: true
        options:
          - beta
          - master
      dry_run:
        description: "Generate, diff and build the Flathub manifest; push and open nothing"
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  stub:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse to run on master
        run: |
          echo "This is master's stub of flathub-pr.yaml: dispatch with --ref rust-rewrite." >&2
          exit 1
