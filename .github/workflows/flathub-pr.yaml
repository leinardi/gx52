name: Flathub PR

# Opens (or updates) the pull request that ships a released tag on Flathub
# (docs/release.md, "The Flathub pull request"), against the channel branch of
# flathub/com.leinardi.gx52: `beta` or `master`. The maintainer merges it once Flathub's bot built
# it.
#
#   prepare  no secret. The Flathub branch's tree is replaced, not patched: its files go (the
#            legacy Python modules, pypi-dependencies.json, the submodules; README.md stays), and
#            it gets the tagged tree's stable manifest put through scripts/flathub-manifest.sh (the
#            app's dir source becomes the git source of the tag), a cargo-sources.json generated
#            from the tagged Cargo.lock with the pinned generator, and a flathub.json for x86_64
#            and aarch64. flatpak-builder-lint checks the manifest; the full diff is printed, and
#            the change is committed and uploaded as a git bundle.
#   build    the generated manifest built on x86_64 and aarch64, offline with the vendored crates,
#            as Flathub's bot will build it: from the git tag on a real run.
#   push     the `release` environment's Flathub token, and no repository code: the bundle's
#            commit pushed to release/<channel>/vX.Y.Z (so a beta and a master pull request for one
#            tag can coexist), the pull request opened or left open. Re-running it is safe.
#
# A dry run pushes nothing. Its build uses a dir source in place of the tag: the dispatched commit
# as it is, or, called from release.yaml's dry run, that commit with the bump's patch applied, so
# the manifest, the Cargo.lock behind cargo-sources.json and the build all come from the bumped
# tree. A 0.x tag never goes to master, so 0.99.x cannot replace the stable 0.7.6. A real run comes
# from the trunk only.
#
# GitHub registers a dispatch workflow from the default branch only, so until M9 master carries a
# stub of this file with the same dispatch inputs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to ship, vX.Y.Z"
        type: string
        required: true
      channel:
        description: "The Flathub branch the pull request targets (a 0.x tag goes to beta only)"
        type: choice
        required: true
        options:
          - beta
          - master
      dry_run:
        description: "Generate, diff and build the Flathub manifest; push and open nothing"
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      channel:
        type: string
        required: true
      dry_run:
        type: boolean
        required: true
      patch_artifact:
        description: "An artifact of the calling run holding bump.patch, applied to the dry run's tree"
        type: string
        required: false
        default: ""

permissions: {}

env:
  FLATHUB_REPO: flathub/com.leinardi.gx52
  APP_ID: com.leinardi.gx52

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
    outputs:
      branch: ${{ steps.check.outputs.branch }}

    steps:
      - name: Check the tag, the channel and the ref
        id: check
        env:
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "The tag must be vX.Y.Z, got '$TAG'." >&2
            exit 1
          fi
          if [ "$CHANNEL" != beta ] && [ "$CHANNEL" != master ]; then
            echo "The channel must be beta or master, got '$CHANNEL'." >&2
            exit 1
          fi
          if [[ "$TAG" == v0.* ]] && [ "$CHANNEL" = master ]; then
            echo "$TAG is a 0.x development build: it goes to beta only, never over the stable 0.7.6." >&2
            exit 1
          fi
          if [ "$DRY_RUN" != true ] && [ "$REF" != refs/heads/rust-rewrite ]; then
            echo "A Flathub pull request is opened from rust-rewrite, got $REF; only a dry run may run elsewhere." >&2
            exit 1
          fi
          echo "branch=release/$CHANNEL/$TAG" >> "$GITHUB_OUTPUT"

      # A real run ships the tag; a dry run the dispatched commit, the bump's patch applied when
      # there is one.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.dry_run && github.sha || format('refs/tags/{0}', inputs.tag) }}
          path: gx52
          persist-credentials: false

      - name: Download the bump patch
        if: inputs.dry_run && inputs.patch_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.patch_artifact }}
          path: ${{ runner.temp }}/bump

      - name: Apply the bump patch
        if: inputs.dry_run && inputs.patch_artifact != ''
        env:
          PATCH: ${{ runner.temp }}/bump/bump.patch
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}/gx52"
          git -C gx52 apply --index "${PATCH}"

      - name: Generate cargo-sources.json from the tree's Cargo.lock
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}/gx52"
          make -C gx52 cargo-sources

      # The channel branch as it is. A dry run before the beta branch exists reads master instead,
      # and says so; a real run needs the branch (docs/release.md, "One-time setup").
      - name: Clone the Flathub branch
        env:
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          url="https://github.com/$FLATHUB_REPO.git"
          if git ls-remote --exit-code --heads "$url" "refs/heads/$CHANNEL" >/dev/null; then
            git clone --quiet --branch "$CHANNEL" "$url" flathub
          elif [ "$DRY_RUN" = true ]; then
            echo "::warning::$FLATHUB_REPO has no $CHANNEL branch yet: the dry run diffs against master."
            git clone --quiet --branch master "$url" flathub
          else
            echo "$FLATHUB_REPO has no $CHANNEL branch: create it first (docs/release.md, One-time setup)." >&2
            exit 1
          fi

      - name: Replace the Flathub tree
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            # No tag exists yet: the commit is the dispatched one, for the diff only.
            COMMIT=$(git -C gx52 rev-parse HEAD)
          else
            COMMIT=$(git -C gx52 rev-parse "refs/tags/$TAG^{commit}")
          fi
          cd flathub
          git ls-files -z | while IFS= read -r -d '' path; do
            if [ "$path" != README.md ]; then
              git rm --quiet --cached -- "$path"
              rm -rf -- "$path"
            fi
          done
          ../gx52/scripts/flathub-manifest.sh ../gx52/build-aux/$APP_ID.json "$TAG" "$COMMIT" >"$APP_ID.json"
          cp ../gx52/build-aux/cargo-sources.json cargo-sources.json
          printf '{\n    "only-arches": ["x86_64", "aarch64"]\n}\n' >flathub.json
          git add --all
          echo "The Flathub change (removed files included):"
          git --no-pager diff --cached --stat
          git --no-pager diff --cached -- . ':(exclude)cargo-sources.json'

      - name: Lint the Flathub manifest
        run: flatpak-builder-lint manifest "flathub/$APP_ID.json"

      - name: Commit the change as a bundle
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd flathub
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --no-verify -m "Update to $TAG"
          git bundle create ../flathub.bundle HEAD^..HEAD
          git rev-parse HEAD^ >../flathub.base

      - name: Upload the Flathub change
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flathub-change
          path: |
            flathub.bundle
            flathub.base
            flathub/
            !flathub/.git
          if-no-files-found: error
          retention-days: 7

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      # A dry run builds the tree from a dir source, so it needs the tree (and the patch); a real
      # run builds the git tag, as Flathub does, and needs only the generated files.
      - name: Checkout
        if: inputs.dry_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the bump patch
        if: inputs.dry_run && inputs.patch_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.patch_artifact }}
          path: ${{ runner.temp }}/bump

      - name: Apply the bump patch
        if: inputs.dry_run && inputs.patch_artifact != ''
        env:
          PATCH: ${{ runner.temp }}/bump/bump.patch
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git apply --index "${PATCH}"

      - name: Download the Flathub change
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flathub-change
          path: _flatpak/change

      # Inside _flatpak, which the stable manifest's dir source skips; the dir source points two
      # levels up, at the checkout.
      - name: Write the manifest to build
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p _flatpak/flathub
          cp _flatpak/change/flathub/cargo-sources.json _flatpak/flathub/
          if [ "$DRY_RUN" = true ]; then
            scripts/flathub-manifest.sh "build-aux/$APP_ID.json" --source-dir ../.. >"_flatpak/flathub/$APP_ID.json"
          else
            cp "_flatpak/change/flathub/$APP_ID.json" _flatpak/flathub/
          fi

      - name: Build the Flathub manifest
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: _flatpak/flathub/${{ env.APP_ID }}.json
          arch: ${{ matrix.arch }}
          bundle: gx52-flathub-${{ matrix.arch }}.flatpak
          upload-artifact: false
          cache: false

  push:
    needs: [prepare, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read

    steps:
      - name: Download the Flathub change
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flathub-change
          path: change

      # The bundle's commit, pushed onto release/<channel>/<tag> under a lease on what that branch
      # holds now, then the pull request into the channel: opened once, left open on a re-run.
      - name: Push the branch and open the pull request
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!f() { if [ "$1" = get ]; then echo username=x-access-token; echo "password=$GH_TOKEN"; fi; }; f'
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "The release environment has no FLATHUB_TOKEN secret (docs/release.md, One-time setup)." >&2
            exit 1
          fi
          SAFE_GIT=(git -c core.hooksPath=/dev/null -c core.fsmonitor=false)
          url="https://github.com/$FLATHUB_REPO.git"
          "${SAFE_GIT[@]}" clone --quiet --branch "$CHANNEL" "$url" flathub
          cd flathub
          BASE=$(cat ../change/flathub.base)
          if [ "$("${SAFE_GIT[@]}" rev-parse HEAD)" != "$BASE" ]; then
            echo "$CHANNEL moved since the change was prepared ($BASE -> $("${SAFE_GIT[@]}" rev-parse HEAD)): re-run the whole workflow." >&2
            exit 1
          fi
          "${SAFE_GIT[@]}" fetch --quiet ../change/flathub.bundle HEAD
          COMMIT=$("${SAFE_GIT[@]}" rev-parse FETCH_HEAD)
          OBSERVED=$("${SAFE_GIT[@]}" ls-remote --heads origin "refs/heads/$BRANCH" | awk '{print $1}')
          "${SAFE_GIT[@]}" push --quiet --no-verify --force-with-lease="refs/heads/$BRANCH:$OBSERVED" \
            origin "$COMMIT:refs/heads/$BRANCH"
          echo "Pushed $COMMIT to $FLATHUB_REPO $BRANCH."
          OPEN=$(gh pr list --repo "$FLATHUB_REPO" --base "$CHANNEL" --head "$BRANCH" --state open --json url --jq '.[].url')
          if [ -n "$OPEN" ]; then
            echo "The pull request is already open: $OPEN"
          else
            gh pr create --repo "$FLATHUB_REPO" --base "$CHANNEL" --head "$BRANCH" \
              --title "Update to $TAG" \
              --body "Ships GX52 $TAG (https://github.com/leinardi/gx52/releases/tag/$TAG), generated by the release workflow of leinardi/gx52. Merge it once the test build passes."
          fi
