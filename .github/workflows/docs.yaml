# GitHub Pages deployment for a Zensical site, from the repo-docs-toolkit zensical-site skill
# (references/deploy.md). Copy to .github/workflows/docs.yaml. It builds on every pull request and
# deploys from the default branch. Before the first deploy, set Settings > Pages > Source to
# "GitHub Actions"; until then the deploy job fails.
#
# Every action is pinned to a full commit SHA (the tag is in the comment); let Dependabot's
# github-actions ecosystem update them. Zensical is installed from the hash-pinned lock
# (zensical-requirements.txt, compiled from zensical-requirements.in).
name: Docs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install Zensical from the lock
        run: python -m pip install --disable-pip-version-check --require-hashes -r zensical-requirements.txt

      # --strict fails the build on a broken link, a missing anchor or a missing snippet file.
      - name: Build the site
        run: zensical build --strict --clean

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
