# GitHub Pages deployment for a Zensical site, from the repo-docs-toolkit zensical-site skill
# (references/deploy.md). Copy to .github/workflows/docs.yaml. It builds on every pull request and
# deploys from the default branch. Before the first deploy, set Settings > Pages > Source to
# "GitHub Actions"; until then the deploy job fails.
#
# Every action is pinned to a full commit SHA (the tag is in the comment); let Dependabot's
# github-actions ecosystem update them. Zensical runs through uv from the committed lock of the
# docs project, tools/docs/uv.lock (references/config.md); change DOCS_UV_PROJECT if it lives
# elsewhere.
name: Docs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCS_UV_PROJECT: tools/docs

# One deployment at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv itself is the latest release (the action's default); every package comes from uv.lock.
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # --locked refuses a lock that no longer matches pyproject.toml; uv installs from the lock,
      # hashes included. --strict fails the build on a broken link, a missing anchor or a missing
      # snippet file.
      - name: Build the site
        run: uv run --project "$DOCS_UV_PROJECT" --locked zensical build --strict --clean

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
