schema_version = 1
device_type = "x52-pro"
name = "Off"
kind = "single"
date_format = "dd-mm-yy"

[clock_1]
source = "local"
use_24h = true

[clock_2]
source = { fixed_offset_minutes = -240 }
use_24h = true

[clock_3]
source = { fixed_offset_minutes = 480 }
use_24h = true

[settings]
led_brightness = 0
mfd_brightness = 0
shift = false
blink = false

[settings.leds]
fire = "on"
throttle = "on"
a = "green"
b = "green"
d = "green"
e = "green"
t1_t2 = "green"
t3_t4 = "green"
t5_t6 = "green"
pov_2 = "green"
i = "green"

[settings.mfd]
lines = [
  { source = "empty" },
  { source = "empty" },
  { source = "empty" },
]
