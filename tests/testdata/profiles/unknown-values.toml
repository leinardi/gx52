schema_version = 1
device_type = "x52-pro"
name = "Night flying"

led_brightness = 64
mfd_brightness = 32
shift = false
blink = false
date_format = "yyyy-mm-dd"

[leds]
fire = "on"
throttle = "on"
a = "purple"
b = "green"
d = "red"
e = "red"
t1_t2 = "amber"
t3_t4 = "amber"
t5_t6 = "amber"
pov_2 = "green"
i = "off"

[mfd]
lines = ["GX52", "", "Night flying"]

[clock_1]
source = "gmt"
use_24h = true

[clock_2]
source = { iana = "Mars/Olympus_Mons" }
use_24h = true

[clock_3]
source = { zone = "UTC" }
use_24h = false
