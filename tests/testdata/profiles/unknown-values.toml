schema_version = 1
device_type = "x52-pro"
name = "Night flying"
kind = "single"
date_format = "yyyy-mm-dd"

[clock_1]
source = "gmt"
use_24h = true

[clock_2]
source = { iana = "Mars/Olympus_Mons" }
use_24h = true

[clock_3]
source = { zone = "UTC" }
use_24h = false

[settings]
led_brightness = 64
mfd_brightness = 32
shift = false
blink = false

[settings.leds]
fire = "on"
throttle = "on"
a = "purple"
b = "green"
d = "red"
e = "red"
t1_t2 = "amber"
t3_t4 = "amber"
t5_t6 = "amber"
pov_2 = "green"
i = "off"

[settings.mfd]
lines = [
  { source = "text", text = "GX52" },
  { source = "empty" },
  { source = "text", text = "Night flying" },
]
