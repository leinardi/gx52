# Applies to every workspace member: clippy reads the clippy.toml of the workspace root.

allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Proper names the docs cite (a technology, a format, a tool, a device), never an identifier that
# should be in backticks; ".." keeps clippy's default list.
doc-valid-idents = [
    "GObject",
    "GLib",
    "GResource",
    "GSettings",
    "GTK",
    "libadwaita",
    "Flatpak",
    "Flathub",
    "AppIndicator",
    "X52",
    "evdev",
    "uinput",
    "udev",
    "..",
]
