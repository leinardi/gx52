# Applies to every workspace member: clippy reads the clippy.toml of the workspace root.

allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Proper names the docs cite (a technology, a format, a tool, a device), never an identifier that
# should be in backticks; ".." keeps clippy's default list. Only names a doc comment actually uses
# and clippy's doc_markdown would otherwise flag belong here: none does yet, so the list is the
# default. Add a name in the change whose docs need it.
doc-valid-idents = [
    "..",
]

# The MFD clocks read the time through the injected x52::clock::Clock, so the tests can set it
# (docs/architecture.md, "Testability"). Only x52::clock::SystemClock reads it directly, through an
# #[expect(clippy::disallowed_methods, reason = "...")]; with the workspace's
# disallowed_methods = "deny", any other read fails clippy.
disallowed-methods = [
    { path = "jiff::Timestamp::now", reason = "read the time from the injected Clock" },
    { path = "jiff::Zoned::now", reason = "read the time from the injected Clock" },
    { path = "std::time::SystemTime::now", reason = "read the time from the injected Clock" },
    { path = "std::time::Instant::now", reason = "read the time from the injected Clock" },
]
