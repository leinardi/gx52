#
# The workspace: the root package is the gx52 application (src/, next to the Meson build), x52 the
# device library with no GTK dependency, meta the repository meta-tests (docs/tooling-todo.md).

[workspace]
# Listed explicitly, never as a glob, so a new member is a reviewed change.
members = [".", "meta", "x52"]
resolver = "3"

[workspace.package]
edition = "2024"
# One exact Rust release, the one rust-toolchain.toml pins.
rust-version = "1.98.0"
license = "GPL-3.0-or-later"
authors = ["Roberto Leinardi"]
repository = "https://github.com/leinardi/gx52"

# The lint set lives here once. Every member opts in with `[lints] workspace = true` (a member does
# not inherit it otherwise), and every clippy run is workspace-wide.
[workspace.lints.rust]
# deny, not forbid: only #[expect] can lift a denied lint, should one audited module ever need it.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Only `#[expect(lint, reason = "...")]` may silence a lint: it fails once the lint stops firing,
# and the reason is mandatory.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# No panics outside tests; clippy.toml allows both in tests.
unwrap_used = "deny"
expect_used = "deny"
# Output goes through tracing, or an explicit writeln! to a handle.
print_stdout = "deny"
print_stderr = "deny"
# A match on an enum names every variant, so a new variant is a compile-time decision everywhere.
wildcard_enum_match_arm = "deny"
# Descriptive names; clippy's default allow-list applies.
min_ident_chars = "deny"
# Any ban added to clippy.toml is only enforced if the lint is.
disallowed_methods = "deny"

[package]
name = "gx52"
# The release workflow sets the version (docs/rewrite-analysis.md, section 9).
version = "0.0.0"
description = "Configure the Logitech X52 and X52 Pro joysticks"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Keep the version features in sync with the dependency() checks in meson.build and the
# runtime-version of the Flatpak manifests (build-aux/). Required: GNOME 50 (GTK 4.22, libadwaita
# 1.9, what Ubuntu 26.04 ships); built and tested on the GNOME 51 runtime (spike S6). adw's gtk_v4_*
# feature matters too: without gtk_v4_10, adw widgets do not implement gtk::Accessible in Rust.
gtk = { package = "gtk4", version = "0.11", features = ["gnome_50"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9", "gtk_v4_22"] }
# Named after its library (gettextrs), so cargo-machete matches it to the code that uses it.
gettextrs = { package = "gettext-rs", version = "0.8", features = ["gettext-system"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The protocol, the device model and the clock logic (docs/architecture.md, "Workspace").
x52 = { path = "x52" }
# The device writer opens the joystick and sends its control transfers (spike S1).
nusb = "0.2"
# Worker threads report to the GTK main thread (docs/architecture.md, "Threads and data flow").
async-channel = "2"
# The system time zone the clocks follow.
jiff = "0.2"
thiserror = "2"
# Awaits the host hotplug stream against the shutdown signal, with no async runtime.
futures-lite = "2"
# The device watch's periodic x52d check next to the hotplug stream (the tray uses it too, later).
async-io = "2"
# The joystick's input events: the mode selector (spike S3).
evdev = "0.13"
# poll(2) on the evdev node with a timeout.
rustix = { version = "1", features = ["event", "fs", "net"] }
# Profile files (docs/profiles.md): parsed into a table first, then field by field.
toml = "1.1.8"
# The one-time import of the GX52 0.7 database, opened read-only. Linked to the system SQLite
# (libsqlite3-dev on the host, the GNOME SDK in the Flatpak), not bundled.
rusqlite = "0.41.0"
# The private copy of the GX52 0.7 database that the import reads.
tempfile = "3.27.0"

[dev-dependencies]
x52 = { path = "x52", features = ["test-support"] }

[lints]
workspace = true

[profile.release]
# flatpak-builder splits the debug info into the .Debug extension.
debug = true
lto = "thin"
codegen-units = 1

# Line tables only for the workspace: backtraces keep their files and lines, and the debug and
# test binaries shrink to a fraction of their size.
[profile.dev]
debug = "line-tables-only"

# Dependencies optimized in dev builds too, so a Devel build stays responsive; no debug info for
# them.
[profile.dev.package."*"]
opt-level = 3
debug = false
