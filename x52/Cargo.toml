[package]
name = "x52"
version = "0.0.0"
description = "X52 and X52 Pro protocol, device model, key maps and MFD character set"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# The RecordingTransport and the FakeClock, for the tests of the crates that use them.
test-support = []

[dependencies]
# Reads the system's time zone database (/usr/share/zoneinfo, shipped by the GNOME runtime).
jiff = "0.2"
thiserror = "2"

[lints]
workspace = true
