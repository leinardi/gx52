[package]
name = "meta"
version = "0.0.0"
description = "Repository meta-tests for gx52"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The Markdown reader of the library, and the source scans of the tests.
[dependencies]
regex = "1.13.1"

# The pre-commit configuration and the workflows (YAML), the scratch repositories of the script
# tests, and the workspace manifests (TOML).
[dev-dependencies]
serde_yaml_ng = "0.10"
tempfile = "3.27.0"
toml = "1.1.8"
